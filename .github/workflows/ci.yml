name: GitHub CI
run-name: ${{ github.actor }} CI
on: [push]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install
        run: |
          npm i

      - name: run formatter
        run: |
          npm run format

      - name: check for formatting changes
        run: |
          git diff --exit-code ':!package-lock.json'

      - name: svelte check
        run: |
          npm run check

      - name: lint
        run: |
          npm run lint

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update && sudo apt-get install libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: create .env
        run: |
          echo "PLAID_CLIENT_ID=placeholder" >> .env
          echo "PLAID_SECRET=placeholder" >> .env
          echo "PLAID_VERSION=placeholder" >> .env
          echo "PLAID_ENV=placeholder" >> .env
          echo "PLAID_PRODUCTS=placeholder" >> .env
          echo "PLAID_COUNTRY_CODES=placeholder" >> .env

      - name: build
        run: |
          cargo build

      - name: run formatter
        run: |
          cargo fmt

      - name: check for formatting changes
        run: |
          git diff --exit-code

      - name: clippy
        run: |
          cargo clippy

      - name: test
        run: |
          cargo test

      - name: cache install
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
